name: Build DSH APK with 154 WebView

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      # ---- 1. 下载并解压 dsh-payload.zip ----
      - name: Download and extract DSH payload
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-home"
          curl -L -o "$RUNNER_TEMP/dsh-payload.zip" \
            "https://github.com/zhaojiahang-max/deepseek-harness-android-updater/releases/download/1.1/dsh-payload.zip"
          unzip -q "$RUNNER_TEMP/dsh-payload.zip" -d "$RUNNER_TEMP/dsh-home"
          echo "DSH_DEV_HOME=$RUNNER_TEMP/dsh-home" >> $GITHUB_ENV
          echo "===== 解压后的结构 ====="
          ls -la "$RUNNER_TEMP/dsh-home"

      # ---- 2. 自动补全缺失的 .dsh 文件夹 ----
      - name: Auto-create missing .dsh folder
        run: |
          DSH_DIR="$RUNNER_TEMP/dsh-home/.dsh"
          mkdir -p "$DSH_DIR/profiles/web/node_modules/@deepseek-ai"
          mkdir -p "$DSH_DIR/profiles/web/node_modules/@jiesou"
          
          if [ ! -f "$DSH_DIR/cordis.patch.yml" ]; then
            touch "$DSH_DIR/cordis.patch.yml"
            touch "$DSH_DIR/cordis.yml"
            echo "{}" > "$DSH_DIR/settings.yaml"
            echo '{"name": "dsh"}' > "$DSH_DIR/profiles/web/package.json"
            touch "$DSH_DIR/profiles/web/pnpm-workspace.yaml"
          fi
          
          if [ -d "plugins" ]; then
            cp -R plugins/* "$DSH_DIR/profiles/web/node_modules/@deepseek-ai/" || true
          fi
          echo "  ✅ .dsh 目录结构检查与补全完成"

      # ---- 3. 创建 CI 专用的 build/env.sh ----
      - name: Create CI env.sh for build.sh
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-home/build"
          cat > "$RUNNER_TEMP/dsh-home/build/env.sh" << 'EOF'
          #!/bin/bash
          export JAVA_HOME="$JAVA_HOME"
          export JAVA_BIN="$JAVA_HOME/bin"
          export ANDROID_JAR="${ANDROID_HOME}/platforms/android-34/android.jar"
          export PATH="${ANDROID_HOME}/build-tools/34.0.0:${ANDROID_HOME}/platform-tools:$JAVA_HOME/bin:$PATH"
          EOF

      # ---- 4. 下载 154 WebView 内核到 assets ----
      - name: Download 154 WebView kernel
        run: |
          mkdir -p android-app/assets
          curl -L -o android-app/assets/webview154.apk \
            "https://github.com/zhaojiahang-max/deepseek-harness-android-updater/releases/download/1.0/com.google.android.webview_154.0.8037.101-803710103_minAPI29.arm64-v8a.armeabi-v7a.nodpi._apkmirror.com.apk"

      # ---- 5. 生成临时签名密钥 ----
      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v -keystore android-app/release.jks -alias dsh \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=DSH, O=GitHub, L=CI, S=CI, C=CN"

      # ---- 6. 修复脚本兼容性并执行 build.sh ----
      - name: Build APK
        env:
          DSH_DEV_HOME: ${{ runner.temp }}/dsh-home
          DSH_GLIBC_RUNTIME: ${{ runner.temp }}/dsh-home/runtime-glibc
          BUILD_SYNC_PLUGINS: "1"
          KEYSTORE_PASS: "android"
          KEYSTORE_ALIAS: "dsh"
        run: |
          cd android-app
          chmod +x build.sh env.sh build-vscreen-jar.sh
          
          # 关键修复：在 CI 中自动替换脚本里的 Android Shell 语法为 Linux Shell 语法
          # 1. 将 `source` 替换为 `.`（dash 兼容）
          sed -i 's/source /\. /g' build.sh build-vscreen-jar.sh env.sh
          # 2. 将子脚本调用的 `sh` 替换为 `bash`
          sed -i 's/sh \$P\/build-vscreen-jar.sh/bash \$P\/build-vscreen-jar.sh/g' build.sh
          # 3. 将 shebang 改为 bash
          sed -i 's|#!/system/bin/sh|#!/bin/bash|g' build.sh build-vscreen-jar.sh env.sh
          
          # 额外替换 build.sh 中所有 `sh ` 调用为 `bash `，防止其他子脚本也报错
          # 注意：这可能会影响逻辑，但通常 bash 兼容 sh
          sed -i 's/ sh / bash /g' build.sh
          
          set +e
          bash build.sh > build_output.log 2>&1
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=================================================="
            echo "❌ 构建失败，退出码: $EXIT_CODE。最后的日志如下："
            echo "=================================================="
            tail -n 100 build_output.log
            echo "=================================================="
            exit $EXIT_CODE
          fi
          
          echo "=================================================="
          echo "✅ 构建成功！APK 位置："
          ls -l DeepSeekHarness.apk
          echo "=================================================="

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-154-webview
          path: android-app/DeepSeekHarness.apk
